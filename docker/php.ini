date.timezone = America/Montevideo
display_errors = On
; Los errores no guardan los datos que se estaban usando (podría haber una contraseña)
zend.exception_ignore_args = On
error_reporting = E_ALL

; La cookie de sesión no la puede leer el JavaScript de la página
session.cookie_httponly = 1
; No se manda cuando el pedido lo arma otro sitio
session.cookie_samesite = Lax
; No se acepta un id de sesión inventado desde afuera
session.use_strict_mode = 1
