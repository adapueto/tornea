# Qué archivos de la app se pueden abrir desde el navegador.
# Todo está cerrado y solo se abre lo que es parte de la web.

# Cerrado: modelos, helpers, configuración, base, documentación, Docker...
<Directory /var/www/html/tornea>
    Require all denied
</Directory>

# Abierto: la página de inicio (/tornea, /tornea/ o /tornea/index.php)
<LocationMatch "^/tornea(/|/index\.php)?$">
    Require all granted
</LocationMatch>

# Abierto: estilos, scripts e imágenes
<Directory /var/www/html/tornea/css>
    Require all granted
</Directory>
<Directory /var/www/html/tornea/js>
    Require all granted
</Directory>
<Directory /var/www/html/tornea/img>
    Require all granted
</Directory>

# Abierto: las páginas y los controllers, solo con el nombre exacto
# (así no se abre una copia como login.php.bak ni login.PHP)
<Directory /var/www/html/tornea/app/views>
    <FilesMatch "^[a-z-]+\.php$">
        Require all granted
    </FilesMatch>
</Directory>
<Directory /var/www/html/tornea/app/controllers>
    <FilesMatch "^[A-Z][A-Za-z]+Controller\.php$">
        Require all granted
    </FilesMatch>
</Directory>

# Cerrado: los pedazos de página que se usan dentro de otras
# (va al final para que gane sobre lo de arriba, con mayúsculas o sin ellas)
<LocationMatch "(?i)^/tornea/app/views/partials(/|$)">
    Require all denied
</LocationMatch>
