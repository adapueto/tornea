services:
  web:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"            # si el 80 está ocupado, usá "8080:80"
    environment:
      DB_HOST: db
      DB_NAME: tornea
      DB_USER: tornea_app
      DB_PASS: ${DB_APP_PASSWORD:?falta DB_APP_PASSWORD}
    # Sin volumes: el código va dentro de la imagen, así .env y .git no quedan servidos
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?falta DB_ROOT_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?falta DB_APP_PASSWORD}
      DB_READONLY_PASSWORD: ${DB_READONLY_PASSWORD:?falta DB_READONLY_PASSWORD}
      DB_BACKUP_PASSWORD: ${DB_BACKUP_PASSWORD:?falta DB_BACKUP_PASSWORD}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    # Sin ports: la base solo es accesible desde la red interna de Docker
    volumes:
      - db_data:/var/lib/mysql
      # Se ejecutan en orden alfabético solo la primera vez (volumen vacío)
      - ./database/tornea.sql:/docker-entrypoint-initdb.d/01-tornea.sql:ro
      - ./database/docker/02-dcl.sh:/docker-entrypoint-initdb.d/02-dcl.sh:ro
      # Sin datos de prueba: para una demo, sumar docker-compose.demo.yml
    healthcheck:
      # Por TCP: durante la carga inicial MySQL no escucha en red, así que
      # "web" no arranca hasta que terminen los scripts de inicialización
      # No necesita contraseña: si MySQL contesta (aunque sea "acceso denegado"), está vivo
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "--silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

volumes:
  db_data:
